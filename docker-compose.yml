version: '3.8'

services:
  # 1. Redis In-Memory Geospatial Index (v7)
  redis:
    image: redis:7-alpine
    container_name: jerebu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Consolidated Python FastAPI Backend (Reports CRUD, Geospatial, DBSCAN & NLP)
  backend:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    container_name: jerebu-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 3. Vue 3 Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jerebu-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
